name: hugow-opc

services:
  hugow:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${HUGOW_IMAGE:-ghcr.io/hugoworld/opc-site:local}
    container_name: hugow-opc
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "${HUGOW_WWW_PORT:-8080}:8080"
      - "${HUGOW_ADMIN_PORT:-8081}:8081"
    volumes:
      - "${HUGOW_DATA_DIR:-./data}:/srv/hugow/data"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
