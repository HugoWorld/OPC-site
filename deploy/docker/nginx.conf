user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    limit_req_zone $binary_remote_addr zone=hugow_static:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=hugow_api:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=hugow_conn:10m;

    # ---------------- 访客站 8080 ----------------
    server {
        listen 8080;
        server_name _;

        root /srv/hugow/www;
        index index.html;

        limit_conn hugow_conn 20;
        limit_req_status 429;
        limit_conn_status 429;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        location /assets/ {
            limit_req zone=hugow_static burst=20 nodelay;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location = /data/current.json {
            alias /srv/hugow/data/current.json;
            default_type application/json;
            add_header Cache-Control "public, max-age=30, must-revalidate";
            add_header Access-Control-Allow-Origin "*" always;
        }

        location /data/ {
            alias /srv/hugow/data/;
            default_type application/json;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*" always;
        }

        location / {
            limit_req zone=hugow_static burst=20 nodelay;
            try_files $uri $uri/ /index.html;
        }
    }

    # ---------------- 工作台 8081 ----------------
    server {
        listen 8081;
        server_name _;

        root /srv/hugow/admin;
        index index.html;

        limit_conn hugow_conn 20;
        limit_req_status 429;
        limit_conn_status 429;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        # ---------------- 工作台内嵌的访客草稿预览 ----------------
        # 预览必须是访客站构建（dist/www），且与工作台同源，iframe 才能共享
        # 同一份 localStorage 草稿；不能直接用 8081 根路径（那是 AdminApp）。
        location = /preview {
            return 302 /preview/;
        }
        location /preview/ {
            alias /srv/hugow/www/;
            add_header X-Frame-Options SAMEORIGIN always;
        }
        location /preview/data/ {
            alias /srv/hugow/data/;
            default_type application/json;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location /api/ {
            limit_req zone=hugow_api burst=5 nodelay;
            proxy_pass http://127.0.0.1:8787;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 90s;
            proxy_send_timeout 25s;
            proxy_buffering off;
        }

        location = /admin.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # 工作台也要能读到同一份发布快照：前端 readSnapshot 从 ./data/ 取 current.json。
        # 访客站与工作台共用一个 data 卷，这里必须显式暴露，否则工作台会 404 后回落本地缓存。
        location = /data/current.json {
            alias /srv/hugow/data/current.json;
            default_type application/json;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location /data/ {
            alias /srv/hugow/data/;
            default_type application/json;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /admin.html;
        }
    }
}
