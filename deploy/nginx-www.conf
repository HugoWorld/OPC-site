# ==================================================================
# www.hugogoodidea.com —— 访客站
# 安装到 /etc/nginx/sites-available/hugow-www.conf
# 占位符由 deploy.sh 用 sed 替换；证书域名统一用主域名。
# ==================================================================

server {
    listen 80;
    server_name __WWW_HOST__;

    # ACME HTTP-01 验证；其余请求一律跳 HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name __WWW_HOST__;

    ssl_certificate     /etc/letsencrypt/live/__CERT_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERT_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root __APP_ROOT__/www;
    index index.html;

    limit_conn hugow_conn 20;
    limit_req_status 429;
    limit_conn_status 429;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 入口页不缓存，保证每次发布后立刻拿到新的资源指纹
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # 带 hash 的静态资源：一年 immutable
    location /assets/ {
        limit_req zone=hugow_static burst=20 nodelay;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # 当前指针：短缓存 + ETag，发布后 30 秒内可见
    location = /data/current.json {
        alias __APP_ROOT__/data/current.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=30, must-revalidate";
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # 版本快照不可变，可长缓存
    location /data/ {
        alias __APP_ROOT__/data/;
        default_type application/json;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # 站点页面：SPA 兜底；只对 HTML 生效
    location / {
        limit_req zone=hugow_static burst=20 nodelay;
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/hugow-www.access.log;
    error_log  /var/log/nginx/hugow-www.error.log warn;
}
