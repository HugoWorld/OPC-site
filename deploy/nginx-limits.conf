# ------------------------------------------------------------------
# Nginx 限流共享区：www / admin 两个 server 共用，只允许定义一次。
# 安装到 /etc/nginx/conf.d/hugow-limits.conf
# ------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=hugow_static:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=hugow_api:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=hugow_conn:10m;
