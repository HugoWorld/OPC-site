# ==================================================================
# 证书签发前的临时 Nginx 配置：只开 80，供 certbot --webroot 验证。
# deploy.sh 会先安装它，签完证书再换成最终 www/admin 配置。
# ==================================================================

server {
    listen 80;
    server_name __WWW_HOST__ __ADMIN_HOST__;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        default_type text/plain;
        return 200 "HugoW deploy bootstrap: certificate pending\n";
    }
}
